name: macOS build and smoke tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: src-tauri/resources
          key: asr-${{ runner.os }}-${{ runner.arch }}-small-q5-v174-${{ hashFiles('scripts/setup-*.sh') }}
      - run: bash scripts/setup-asr.sh
      - run: bash scripts/setup-llm.sh
      - run: npm ci
      - run: npx playwright install chromium
      - name: Browser smoke tests
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/aboboo-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID"' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:1420 >/dev/null && break; sleep 1; done
          npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --release
      - run: npm run tauri build -- --bundles app
      - name: Sign and archive
        run: |
          codesign --force --sign - 'target/release/bundle/macos/Aboboo Community.app/Contents/Resources/resources/asr/whisper-cli'
          for file in 'target/release/bundle/macos/Aboboo Community.app/Contents/Resources/resources/llm/'*.dylib 'target/release/bundle/macos/Aboboo Community.app/Contents/Resources/resources/llm/llama-completion'; do codesign --force --sign - "$file"; done
          codesign --force --deep --sign - --entitlements src-tauri/entitlements.plist 'target/release/bundle/macos/Aboboo Community.app'
          codesign --verify --deep --strict 'target/release/bundle/macos/Aboboo Community.app'
          ditto -c -k --sequesterRsrc --keepParent 'target/release/bundle/macos/Aboboo Community.app' Aboboo-Community-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Aboboo-Community-macOS
          path: Aboboo-Community-macOS.zip
