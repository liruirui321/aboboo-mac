[package]
name = "aboboo"
version = "0.5.2"
edition = "2021"
default-run = "aboboo"

[lib]
name = "aboboo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aboboo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "block2"] }
